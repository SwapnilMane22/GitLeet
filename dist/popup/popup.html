<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitLeet</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      body {
        margin: 0;
        padding: 12px;
        width: 360px;
        color: #e5e7eb;
        background: #020617;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
      }
      .muted {
        color: #9ca3af;
        font-size: 12px;
      }
      button {
        cursor: pointer;
        border: 1px solid #1f2937;
        background: #16a34a;
        color: #0b1120;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
      }
      button.secondary {
        background: transparent;
        color: #e5e7eb;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .card {
        margin-top: 10px;
        border-radius: 12px;
        padding: 12px;
        background: #020617;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.75);
        border: 1px solid #1f2937;
      }
      .list {
        margin: 8px 0 0 0;
        padding: 0;
        list-style: none;
      }
      .list li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
        padding: 6px 0;
        border-top: 1px solid #111827;
      }
      .list li:first-child {
        border-top: 0;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .pill {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #22c55e;
        background: rgba(34, 197, 94, 0.1);
        color: #bbf7d0;
      }
      .error {
        color: #fecaca;
        font-size: 12px;
        margin-top: 8px;
      }
      .status-pill {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #1f2937;
      }
      .status-pill-synced {
        background: rgba(34, 197, 94, 0.1);
        color: #bbf7d0;
        border-color: #22c55e;
      }
      .status-pill-failed {
        background: rgba(248, 113, 113, 0.1);
        color: #fecaca;
        border-color: #ef4444;
      }
      .status-pill-pending {
        background: rgba(148, 163, 184, 0.15);
        color: #e5e7eb;
        border-color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <div class="title">GitLeet</div>
        <div id="status" class="muted">Loading…</div>
      </div>
      <span id="linkedPill" class="pill" style="display: none">Linked</span>
    </div>

    <div class="card">
      <div class="row">
        <div class="title">Current problem</div>
        <button id="openOptionsBtn" class="secondary">Options</button>
      </div>
      <div class="muted" style="margin-top: 8px">
        GitLeet auto-pushes on Accepted submissions when capture works. Status
        below updates every minute while this popup is open.
      </div>
      <div id="captureRow" style="margin-top: 10px; font-size: 12px">
        <div class="row">
          <span id="captureProblem">(no problem yet)</span>
          <span id="captureStatusText" class="status-pill status-pill-pending"
            >Waiting for capture…</span
          >
        </div>
        <div id="captureMessage" class="muted" style="margin-top: 6px"></div>
      </div>
      <div id="err" class="error" style="display: none"></div>
    </div>

    <div class="card">
      <div class="row">
        <div class="title">Recent syncs</div>
        <div class="muted">Last 3</div>
      </div>
      <ul id="recentList" class="list"></ul>
      <div id="recentEmpty" class="muted" style="margin-top: 8px; display: none">
        No syncs yet.
      </div>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
