name: Release (build + zip dist)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.0.1). This becomes the tag v<version>."
        required: true
        default: "0.0.1"
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (if package-lock exists)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Build extension (dist/)
        run: npm run build

      - name: Create release zip from dist contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          ZIP="releases/gitleet-v${VERSION}.zip"
          rm -f "$ZIP"
          (cd dist && zip -r "../$ZIP" .)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "GitLeet v${{ env.VERSION }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: "${{ env.ZIP }}"
